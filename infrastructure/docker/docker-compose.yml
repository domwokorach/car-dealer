# Local PostgreSQL for development and integration tests.
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
# Connect with: postgresql://postgres:postgres@localhost:5432/car_dealer_dev
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: car_dealer_dev
    ports:
      - '5432:5432'
    volumes:
      - car_dealer_pg:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  car_dealer_pg:
